# Navegação no SIMULADOR — ver o cabeçalho de `movimentacao_sim.yaml`.

goal_navigator:
  ros__parameters:
    v_max: 0.5
    a_lin: 0.5

    # Tem que ficar acima da zona morta da placa fingida (0,10), senão a
    # aproximação final é engolida e o robô para longe do ponto achando que
    # chegou.
    v_min_viavel: 0.15

    # Giro que a máquina sustenta numa curva [rad/s] — NÃO MEDIDO
    # (ensaio `curva` do banco). É ele que impede o robô de orbitar um ponto
    # perto: perto do alvo, velocidade alta faz o ponto escapar pelo lado.
    wz_util: 0.5

    raio_chegada: 0.15

    # Manobra de ré (decisão 007). Aqui ela é a regra, não a exceção: com
    # bitola 0,20 e zona morta 0,10 o pivô não existe, então todo ponto dentro
    # de 0,30 m de raio (= v_min_viavel/wz_util) depende de recuar.
    raio_min_curva: -1.0     # negativo = deduzir; 0 = pivota e nunca dá ré
    v_re_max: 0.20
    re_max_dist: 1.0
    re_max_s: 8.0

    taxa: 20.0
    timeout_pose: 1.0
