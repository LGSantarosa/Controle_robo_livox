# Parâmetros da movimentação do robô 2 — TODOS em SI, TODOS num lugar só.
#
# ⚠️ ESTE É O PERFIL DO ROBÔ REAL: é o que a `pilha.launch.py` carrega quando
# `sim:=false`, ou seja, o que roda em toda navegação de verdade. O perfil do
# simulador é o `movimentacao_sim.yaml`, e ele é OUTRO de propósito.
#
# Procedência, por linha: `bitola` e `zona_morta` estão MEDIDAS no robô
# (`docs/MODELO_ROBO2.md`); `a_dec` segue sendo escolha conservadora e não a
# medida — está marcado abaixo, onde mora.
#
# Racional de cada um: `docs/decisoes/005-lei-de-frenagem-de-rumo.md`.

heading_controller:
  ros__parameters:

    # Desaceleração angular que a máquina entrega [rad/s²].
    # É O PARÂMETRO CENTRAL: o sobrepasso do controlador velho valia
    # wz²/(2·a_dec), e é dele que vinha o S.
    #   medir com: ensaio `degrau_giro`
    #   estimativa a partir do S relatado pelo dono: ~0,5
    #   valor aqui: 0,3 — abaixo da estimativa, de propósito.
    #   Medido: errar pra baixo custa 0,3 s a mais e zero sobrepasso;
    #           errar pra cima traz o S de volta.
    #
    #   ⚠️ NÃO é a medida: 07-31 mediu ~3,05 rad/s² no robô (faixa 2,08–3,67,
    #   n=4), 10x este valor. Fica o conservador DE PROPÓSITO por enquanto —
    #   subir a frenagem mexe direto no S que só assentou em 11-08, e isso
    #   merece leva própria, com corrida de controle. Não é esquecimento;
    #   é a diferença entre o que a máquina faz e o que pedimos dela.
    a_dec: 0.1        # 12-08 no robô: era 0.3 e o rumo oscilava 38° seguindo o
                      # Nav2. O seguidor APONTA para um ponto a 0,30 m
                      # (`rumo_para`, sem termo de erro lateral), então 0,10 m
                      # fora da linha viram 18° de ordem — e a lei respondia
                      # com 0,43 rad/s dentro de uma malha com 0,94 s de tempo
                      # morto. Mesmo remédio de 06-08: baixar o GANHO, não o
                      # teto (o teto a placa ignora; em arco ela preserva a
                      # razão). Com 0,1 os mesmos 18° pedem 0,25 rad/s.

    # Tetos. Iguais aos do diff_drive_controller — limite num lugar só.
    wz_max: 1.0
    v_max: 0.5

    # Zona morta da RODA [m/s]: abaixo disso a placa ignora o comando.
    #
    #   MEDIDO NO ROBÔ 2026-07-31 (decisão 020): 0,0178 de frente, 0,0148 de ré
    #   — fica o maior dos dois, que cobre os dois sentidos. Era 0.15, um chute
    #   conservador de antes da bancada, e o erro de 8x NÃO ficava parado aqui:
    #   proibia o pivô por aritmética (exigia 1,48 rad/s contra teto de 1,00,
    #   e a máquina gira 147° com wz=0,30) e ABRIA AS CURVAS — o pedido
    #   (v=0,10 · wz=0,30), que o robô entregou em raio 0,333 m, saía desta lei
    #   como 0,802 m. Acelerar para escapar da banda muda a razão entre as
    #   rodas, e a razão é o raio.
    #
    #   🔴 ESTE NÚMERO SUPÕE `deadband_enable=true` no `robo2.urdf.xacro`.
    #   Com a compensação ligada o limiar real é o `mx > 1.0` do driver
    #   (1 RPM · roda_raio 0,080 = 0,0084 m/s) e a roda de dentro é escalada
    #   junto com a de fora. DESLIGADA — como o banco precisa fazer para
    #   caracterizar — a zona morta de verdade (0,25–0,50 m/s) volta e este
    #   valor fica perigosamente baixo. Há teste travando o par.
    zona_morta: 0.0178

    # Bitola [m] — distância entre as rodas motrizes.
    #   MEDIDA COM TRENA 2026-07-29: por fora das rodas 315 mm, por dentro
    #   225 mm → (315+225)/2 = 270 mm. Era 0.32, herdada e nunca medida.
    #   Entra na conversão de comando em rad/s de roda: errar aqui erra tudo.
    #   ⚠️ Bitola MENOR exige MAIS wz para pivotar. Com a zona morta MEDIDA
    #   (0,0178) o pivô pede 0,50 rad/s contra teto de 1,0 e existe com folga;
    #   com o chute de 0,15 que estava aqui até 12-08 ele pedia 1,48 e era
    #   declarado impossível. Ver decisão 020.
    bitola: 0.270

    margem_piso: 0.05        # folga acima da zona morta [m/s]
    tolerancia_rumo: 0.02    # ~1,1° — abaixo disso não gira [rad]
    taxa: 20.0               # malha do nó [Hz]; medido: a 10 Hz ainda funciona

    timeout_alvo: 1.0        # sem alvo/pose novos por este tempo, para [s]
    plantao_s: 0.5           # comando saindo e robô imóvel: grita no log [s]

    # 🔴 PIVÔ RELIGADO EM 14-08, E SÓ PARA ERRO GRANDE (decisão 036).
    #
    # Pedido do dono, vendo o robô fazer balão para seguir a linha: *"o pivô
    # ainda faz falta, ele fica fazendo balão e se fudendo pra seguir a linha...
    # caso o ângulo da linha comparado com o robô esteja a 80 graus de erro ele
    # para e faz o pivô e acerta, pro balão poder arrumar"*.
    #
    # A decisão 023 tirou o pivô do caminho, e o argumento dela CONTINUA VÁLIDO:
    # a placa entrega um módulo de giro só (2,204 rad/s, medido) e segura a
    # saída cheia por 0,52 s depois do corte, varrendo 93–101° — número que NÃO
    # depende do wz do corte. Os 28 disparos de 12-08 tinham erro entre 35° e
    # 81°: nenhum era executável com um golpe de ~95°.
    #
    # O que muda agora é ONDE ele é usado. A manobra não ficou controlável —
    # ela continua sendo um quantum grosso de ~95°. Só que para erro de 80°+ o
    # quantum É a manobra certa, e o resto o arco fecha:
    #
    #   erro < 80°   lei contínua (arco), que assenta em 0,5–0,6° (medido 023)
    #   erro > 80°   UM pulso de pivô, ~95°, e devolve para o arco
    #
    # `pivo_max_pulsos: 1` é o que impede a volta do ciclo-limite de 12-08
    # (±50–60°, período 5,5 s): com 6 pulsos a lei fica caçando o alvo com um
    # martelo de 95°. Um pulso é "vira grosso e sai da frente".
    # 🔴 14-08 (2ª leva): tentei derivar `pivo_a_dec` = 6,6 do freio da 037 e
    # baixar o gatilho. REPROVADO na corrida G do simulador: a varredura por
    # pulso deu 150–310° (p50 170°) e o robô ficou dando 180°. O `0,6` original
    # previa 232° e estava certo — os 14–28° da 037 são do freio do laço de
    # rumo em arco, não de um pulso de pivô no módulo cheio.
    # A decisão 023 segue de pé, e este perfil nunca chegou a ser mexido.
    limiar_pivo: 1.40          # rad = 80° — ver o aviso acima antes de baixar
    pivo_max_pulsos: 1         # UM golpe grosso, nunca uma perseguição
