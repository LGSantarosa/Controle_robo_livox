# Nav2 de PRODUÇÃO do robô 2 — o que roda quando o robô anda de verdade.
#
# Não confundir com `robot_planning/config/bancada_planner.yaml`: aquele é a
# BANCADA, sobe dois planners lado a lado e não move nada. Este sobe um só, o
# escolhido pela decisão 008, e entra na pilha que dirige.
#
# ⚠️ Os números de GEOMETRIA (raio mínimo de curva, raio do robô, inflação)
# aparecem nos dois arquivos, e `test_configs_coerentes.py` falha se eles
# divergirem. Isso não é zelo: em 29-07 a bitola estava com valores diferentes
# no simulador (0,20) e no robô (0,32), nenhum medido, e sintonizar num e levar
# para o outro erraria duas vezes em sentidos opostos.
#
# QUEM DIRIGE NÃO É O NAV2. O `controller_server` sobe porque a árvore de
# comportamento padrão usa `FollowPath` e sem ele a árvore falha — e junto morre
# o replanejamento, que é o que queremos do Nav2. O `cmd_vel` dele não vai a
# lugar nenhum: quem move roda é `path_follower` → `heading_controller` →
# `/hoverboard_base_controller/cmd_vel`. Os tópicos são diferentes de propósito,
# então nem `twist_mux` é preciso aqui.

map_server:
  ros__parameters:
    yaml_filename: ""          # a launch preenche

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /Odometry
    bt_loop_duration: 10
    default_server_timeout: 20

    # SÓ o navegador de um objetivo. O padrão carrega `navigate_through_poses`
    # junto, com a árvore COM recuperação — e ela derrubava a subida mesmo com a
    # de um objetivo já trocada, porque o `bt_navigator` carrega as duas. Não
    # usamos rota com pontos intermediários; quando usarmos, a árvore dela entra
    # aqui pelo mesmo caminho.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    # Árvore SEM nós de recuperação, replanejando a 1 Hz. A launch aponta o
    # caminho (é de fábrica, `nav2_bt_navigator/behavior_trees/`).
    #
    # A árvore padrão (`..._w_replanning_and_recovery.xml`) foi a primeira
    # tentativa e derrubou o `bt_navigator` na subida: ela exige os servidores
    # `spin`, `backup`, `wait` e `drive_on_heading` do `behavior_server`. Subir
    # o `behavior_server` para satisfazê-la seria errado por dois motivos, e
    # nenhum deles é o erro de carregamento:
    #
    #   1. `spin` é PIVÔ, e este robô não pivota — medido em 29-07, zero
    #      amostras de giro parado no perfil pessimista de zona morta;
    #   2. `backup` é a ré do Nav2, e a decisão 009 tirou a ré do Nav2 do
    #      caminho de propósito. Quem recua é o `path_follower`, por gatilho.
    #
    # E as duas seriam no-op de qualquer jeito: o `cmd_vel` desses
    # comportamentos sai pelo mesmo tópico ignorado do `controller_server`, então
    # a árvore acharia que recuperou sem nada ter acontecido — falha silenciosa,
    # que é a classe de defeito que mais custou tempo neste projeto (BO-3).
    #
    # Recuperação existe, mas é nossa e vive no seguidor.

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    # ⚠️ THETA* desde 05-08, e isto REVISA A DECISÃO 008 pela mesma razão
    # que derrubou a ré: a premissa era "este robô não pivota".
    #
    # A 008 escolheu o Smac Hybrid-A* porque ele respeita raio de curva, e
    # descartou o Theta* com estas palavras (varredura de 29-07): "desenha
    # reta lateral, que só serve para robô que pivota" e "os dois zeros do
    # Theta* nos casos de lado não são virtude — é reta lateral para um robô
    # que TERIA de pivotar".
    #
    # O robô agora pivota (fatia 3 da 011: 7 manobras, 7 fechadas, resíduo
    # mediano 5°). Então a "reta lateral" deixou de ser defeito e virou o
    # caminho certo: ir reto até o ponto e acertar o ângulo lá, em vez de
    # descrever um arco de carro para chegar já apontado. A mesma varredura
    # mediu o preço do arco: o Smac cobra 1,50x a 2,12x mais caminho nos
    # alvos "de lado".
    #
    # O Smac continua sendo a escolha certa para um robô que NÃO pivota, e
    # a bancada (`robot_planning`) segue comparando os dois. Se o pivô
    # regredir no robô real (fatia 4), esta linha volta atrás.
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      # ⚠️ 5,0 desde 05-08, era 2,0 (o valor da bancada, nunca julgado em
      # execução). É o peso de FUGIR de célula cara contra o de andar menos.
      # Medido: com 2,0 o robô atravessava a porta de 0,90 m COLADO numa
      # ombreira — folga de 0,32 m onde o vão centrado daria 0,45 — e o pior
      # ponto das quatro corridas caía sempre ali. O caminho mais curto pela
      # porta passa pela quina; o mais seguro passa pelo meio, e num vão de
      # 0,90 m para um robô de 0,63 m a diferença é tudo.
      w_traversal_cost: 5.0
      # false: o rumo de chegada é problema do PIVÔ, não do plano. É esta
      # linha que materializa "vai reto e ajeita o ângulo lá".
      use_final_approach_orientation: false

    _smac_aposentado_em_05_08:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      # MEDIDO em 29-07 (`tools/banco/corrida_gazebo.py`): raio realizado (p5)
      # de 0,370 m com zona morta 0,10 e 0,463 m com 0,15. O valor definitivo
      # depende da zona morta, que é o item nº 1 da bancada com o robô.
      minimum_turning_radius: 0.37

      # DUBIN = o plano NUNCA dá ré (decisão 009). O custo está medido e
      # aceito; quem cobre os casos que o Dubins não resolve é a ré POR
      # GATILHO, no `path_follower`.
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      reverse_penalty: 2.0     # inerte com DUBIN
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smooth_path: true

controller_server:
  ros__parameters:
    # Frequência baixa de propósito: ele não dirige nada, só mantém a árvore de
    # comportamento viva. Rodar a 20 Hz seria queimar CPU para jogar fora.
    controller_frequency: 5.0
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # Generoso: quem move o robô é a nossa cadeia, e o progresso dela não tem
      # nada a ver com o que este servidor acha que está mandando. Apertar isto
      # faria a árvore abortar uma navegação que está indo bem.
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # TEM que bater com o `raio_chegada` do `path_follower`: é este cheque
      # que faz a árvore declarar sucesso, e quem de fato chega é o nosso
      # seguidor. Se o do Nav2 for menor, a árvore fica pedindo mais depois de
      # o robô já ter parado.
      xy_goal_tolerance: 0.25
      # Rumo na chegada não é requisito deste seguidor (ver decisão 006: girar
      # depois de chegar arrasta o robô para fora do ponto). Tolerância larga
      # para a árvore não exigir o que ninguém vai entregar.
      yaw_goal_tolerance: 3.15

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.55
      max_angular_accel: 1.0

      # ⚠️ SEM detecção de colisão, e isto NÃO é afrouxar segurança.
      #
      # Descoberto na primeira corrida da pilha (29-07, alvo do outro lado da
      # porta de 0,90 m): o robô ATRAVESSOU a porta e então parou, com
      # `RegulatedPurePursuitController detected collision ahead!` abortando o
      # `FollowPath`, a árvore devolvendo `Goal failed` e o `/plan` parando de
      # sair — o seguidor então parou sozinho por "plano velho", corretamente.
      #
      # A premissa de que este servidor era inofensivo por não dirigir estava
      # errada: ele não move roda, mas ABORTA a navegação. E o palpite dele é
      # sobre uma trajetória que ninguém vai executar — ele projeta o caminho a
      # partir da pose supondo os comandos DELE, que vão para o tópico
      # ignorado. Julgar colisão de um movimento que não vai acontecer só pode
      # errar.
      #
      # Quem responde por não bater é o costmap (o plano já nasce inflado) e,
      # quando o Mid-360 entrar no modelo, uma guarda nossa com o sensor de
      # verdade. Enquanto isso o risco fica anotado no ESTADO_PROJETO.
      use_collision_detection: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: false
      # ⚠️ 0,32 desde 05-08, era 0,36 — que NÃO era o circunscrito da caixa.
      # A trena de 29-07 deu caixa 0,433 × 0,455, e o circunscrito disso é
      # 0,314 m; as rodas (borda a 0,158) e a boba (ponta a 0,215) ficam
      # DENTRO. Os 0,36 eram 15% de robô a mais, e numa porta de 0,90 m isso
      # é a diferença entre 9 cm e 13 cm de folga por lado — foi o que fez o
      # planner declarar `Start occupied` com o robô DENTRO do vão.
      # 0,32 = 0,314 medido + 6 mm.
      robot_radius: 0.32
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      # ⚠️ A MESMA camada do local, e ela é OBRIGATÓRIA aqui — não é redundância.
      #
      # MEDIDO no simulador (mundo `pista_surpresa.sdf`, obstáculo que o mapa
      # não tem, em 2,00 · 6,50): com a camada só no local, o
      # `compute_path_to_pose` de (2,0 · 5,0) para (2,0 · 7,2) devolveu um plano
      # RETO — 2,20 m de caminho para 2,20 m de reta, passando a 0,035 m do
      # centro do obstáculo. Quem DIRIGE via a caixa; quem PLANEJA não.
      #
      # O efeito prático disso é um robô que vai reto até o obstáculo novo e
      # para lá: o `collision_monitor` salva a máquina, e ninguém replaneja —
      # ele fica preso, e o replanejamento a 1 Hz devolve o mesmo plano ruim
      # para sempre. Obstáculo que só entra no local costmap não produz desvio,
      # produz travamento educado.
      #
      # Os números que diferem do local, e por quê:
      #   - alcance maior (3,0 marcando, 4,0 limpando): o global existe para
      #     escolher ROTA, e rota se decide com o que está longe. O local é uma
      #     janela de 4 m e não tem para onde guardar isso.
      #   - o resto é idêntico de propósito: duas faixas de altura diferentes
      #     fariam o planejador e o seguidor discordarem sobre o que é chão.
      #
      # ⚠️ AQUI A MARCAÇÃO É PERMANENTE. O global não tem janela rolante: o que
      # for marcado fica até o raytrace limpar ou alguém chamar
      # `/global_costmap/clear_entirely_global_costmap`. Com a TF `map→odom`
      # fixa e provisória (ver o cabeçalho da `pilha.launch.py`), toda deriva do
      # LIO no robô real vira obstáculo fantasma acumulado. **Isto é seguro no
      # simulador e é dívida no robô** — é o mesmo buraco que já obriga o mapa a
      # ser argumento, e a saída é a mesma: localização que case `map` com
      # `odom`.
      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        mark_threshold: 2
        combination_method: 1
        publish_voxel_map: false
        observation_sources: livox
        livox:
          topic: /livox/lidar
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.10
          max_obstacle_height: 0.50
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          # Ver a nota do local: 0,50 s, e o número saiu de medida.
          expected_update_rate: 0.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
      # Inflação: a ALAVANCA que decide o que ele aceita, e não é medida —
      # é escolha. 0,30 aqui, contra 0,45 da bancada, e a diferença é
      # deliberada (ver `test_configs_coerentes.py`).
      #
      # MEDIDO em 29-07, alvo do outro lado da porta de 0,90 m:
      #   0,45 -> o robô ATRAVESSA a porta e trava: o replanejamento a 1 Hz
      #           falha com "Start occupied", porque com raio 0,36 e inflação
      #           0,45 o vão inteiro fica inflado e a célula do próprio robô
      #           conta como ocupada;
      #   0,30 -> chega em 12,4 s, 5,57 m de caminho para 5,32 m de reta (1,05x).
      #
      # Subir de novo faz ele RECUSAR vãos apertados e dar a volta — o que pode
      # ser a decisão certa num corredor de verdade. A launch expõe isto como
      # argumento (`inflacao:=`) justamente para você comparar sem editar YAML.
        # ⚠️ 0,40 desde 05-08, e ANTES era 0,30 — abaixo do raio inscrito
        # (0,363). O Nav2 acusava isso como ERRO desde 01-08 (item 7 do
        # ESTADO) e ninguém tinha medido o custo: sobrava uma faixa de 6 cm
        # onde o CORPO do robô encosta no obstáculo e o costmap diz "livre".
        # O planner roteava por ali e o robô raspava.
        #
        # MEDIDO com 0,30 (`tools/banco/folga.py`, 4 alvos): folga mínima de
        # 0,308 m contra raio de 0,36 — 5 cm de corpo dentro da parede, 2509
        # amostras invadindo. O pior ponto das quatro corridas caiu sempre no
        # vão da porta, que é onde a margem é mais apertada.
        #
        # 0,40 fica ACIMA do inscrito e ABAIXO dos 0,45 que em 29-07 travaram
        # o robô DENTRO da porta de 0,90 m ("Start occupied" no
        # replanejamento, porque o vão inteiro ficava inflado).
        inflation_radius: 0.50
        # ⚠️ `cost_scaling_factor` baixo é o que CENTRA o robô no vão, e sem
        # ele a inflação maior não adianta nada. O padrão do Nav2 (10) faz o
        # custo despencar logo depois do inscrito: dentro da porta a paisagem
        # fica PLANA, e planner que não vê diferença entre o meio e a quina
        # escolhe o caminho mais curto — a quina. Foi o que 05-08 mediu:
        # folga de 0,331 m onde centrar daria 0,45.
        #
        # Com 3,0 o custo decai devagar e as inflações das DUAS ombreiras se
        # encontram no meio do vão, criando um mínimo exatamente no centro.
        # É o gradiente que empurra o caminho para o meio.
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Mesmo número do global, e pelo mesmo motivo — ver lá.
      robot_radius: 0.32
      # ⚠️ A ordem importa: a inflação é sempre a ÚLTIMA, senão ela infla um
      # mapa que ainda não tem o obstáculo que acabou de chegar.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      # ══════════════════════════════════════════════════════════════════
      # A NUVEM DO MID-360 ENTRA AQUI — é esta camada que faz o desvio ao
      # vivo existir (fatia B). Até 06-08 os dois costmaps rodavam só com o
      # mapa estático, e o único consumidor da nuvem no projeto inteiro era o
      # `collision_monitor`: ou seja, o robô não DESVIAVA de obstáculo novo,
      # ele PARAVA na frente dele. O sensor já existia dos dois lados desde
      # 04-08 (decisão 012 no simulador, driver real desde 24-07) — o que
      # faltava era esta camada.
      #
      # ⚠️ `VoxelLayer` e NÃO `ObstacleLayer`, e o motivo é a GEOMETRIA deste
      # sensor. O Mid-360 olha para CIMA: −7° a +52°. A `ObstacleLayer`
      # projeta tudo em 2D e limpa por raytrace 2D, então um raio que passa
      # POR CIMA de uma caixa baixa limpa a célula da própria caixa — o robô
      # esqueceria o obstáculo que acabou de ver. A `VoxelLayer` limpa por
      # voxel em altura e não tem esse modo de falha.
      #
      # ⚠️ Isto é o OPOSTO do que o robô 1 concluiu (`robot_nav/config/
      # nav2_params_pi.yaml`: "sem câmera RGB-D o eixo Z do voxel é desperdício
      # puro", VoxelLayer -> ObstacleLayer). Lá o sensor era um LD06 PLANAR, e
      # com nuvem plana o eixo z é mesmo desperdício. Aqui ele é o que separa
      # "passa por baixo" de "bate". Não portar aquela troca para cá.
      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        # O robô vê o próprio corpo em incidência rasante; sem isto ele se
        # marca e se tranca sozinho no meio da célula onde está.
        footprint_clearing_enabled: true
        # Coluna de 0,80 m (16 × 0,05): cobre o Livox a 0,42 m e sobra. Subir
        # isto só adiciona voxel vazio — o robô tem 0,23 m de caixa.
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        # 2 voxels marcados na coluna para a célula 2D virar obstáculo. 1 é o
        # padrão do Nav2 e aqui seria arriscado: são 20 000 pontos por quadro
        # com σ = 2 cm de ruído, e ponto solto é ruído — mesmo raciocínio do
        # `min_points: 2` do reflexo.
        mark_threshold: 2
        # Max: a camada só ACRESCENTA ao mapa estático, nunca apaga parede
        # conhecida porque o sensor não a viu naquele quadro.
        combination_method: 1
        # Depuração: é assim que se olha no RViz se a nuvem está virando
        # obstáculo. Uma mensagem a 5 Hz num NUC x86 não pesa; se pesar no
        # robô, este é o primeiro a desligar.
        publish_voxel_map: true
        observation_sources: livox
        livox:
          topic: /livox/lidar
          data_type: "PointCloud2"
          marking: true
          clearing: true
          # ⚠️ MESMA FAIXA do `collision_monitor.yaml`, e o
          # `test_configs_coerentes.py` trava os dois juntos. Abaixo de
          # ~0,05 m o próprio chão vira obstáculo (a nuvem erra até 3,8 cm em
          # incidência rasante, medido 05-08); 0,10 dá 2,6x de margem. Acima
          # de 0,50 o robô passa por baixo, e marcar aquilo o faria recusar
          # porta e mesa.
          min_obstacle_height: 0.10
          max_obstacle_height: 0.50
          # A janela é 4×4 m, então o raio útil é 2 m: marcar além disso é
          # produzir célula que a janela joga fora no mesmo ciclo.
          obstacle_max_range: 2.0
          # Limpar pode ir mais longe do que marcar — e deve, senão o robô
          # carrega obstáculo velho na borda da janela.
          raytrace_max_range: 3.0
          # ⚠️ 0,50 s, e este número é uma CORREÇÃO medida — 0,30 foi o primeiro
          # palpite (10 Hz + 3 quadros de folga) e ele não sobrevive à máquina:
          # na primeira corrida o log encheu de
          #
          #     The /livox/lidar observation buffer has not been updated for
          #     0.43 seconds, and it should be updated every 0.30 seconds
          #
          # com a nuvem chegando certinha a 9,7 Hz e carimbo de 100,0 ms sem
          # cauda nenhuma (medido, 281 quadros). O atraso é do CONSUMIDOR, não
          # da fonte: são 20 000 pontos por quadro para transportar e
          # transformar.
          #
          # E isto não é cosmético: buffer vencido deixa a camada NÃO-CURRENT,
          # e costmap não-current é costmap que para. Errar para baixo aqui
          # desliga a percepção com um aviso amarelo por sintoma.
          expected_update_rate: 0.5
      # ══════════════════════════════════════════════════════════════════

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
      # Inflação: a ALAVANCA que decide o que ele aceita, e não é medida —
      # é escolha. 0,30 aqui, contra 0,45 da bancada, e a diferença é
      # deliberada (ver `test_configs_coerentes.py`).
      #
      # MEDIDO em 29-07, alvo do outro lado da porta de 0,90 m:
      #   0,45 -> o robô ATRAVESSA a porta e trava: o replanejamento a 1 Hz
      #           falha com "Start occupied", porque com raio 0,36 e inflação
      #           0,45 o vão inteiro fica inflado e a célula do próprio robô
      #           conta como ocupada;
      #   0,30 -> chega em 12,4 s, 5,57 m de caminho para 5,32 m de reta (1,05x).
      #
      # Subir de novo faz ele RECUSAR vãos apertados e dar a volta — o que pode
      # ser a decisão certa num corredor de verdade. A launch expõe isto como
      # argumento (`inflacao:=`) justamente para você comparar sem editar YAML.
        # ⚠️ 0,40 desde 05-08, e ANTES era 0,30 — abaixo do raio inscrito
        # (0,363). O Nav2 acusava isso como ERRO desde 01-08 (item 7 do
        # ESTADO) e ninguém tinha medido o custo: sobrava uma faixa de 6 cm
        # onde o CORPO do robô encosta no obstáculo e o costmap diz "livre".
        # O planner roteava por ali e o robô raspava.
        #
        # MEDIDO com 0,30 (`tools/banco/folga.py`, 4 alvos): folga mínima de
        # 0,308 m contra raio de 0,36 — 5 cm de corpo dentro da parede, 2509
        # amostras invadindo. O pior ponto das quatro corridas caiu sempre no
        # vão da porta, que é onde a margem é mais apertada.
        #
        # 0,40 fica ACIMA do inscrito e ABAIXO dos 0,45 que em 29-07 travaram
        # o robô DENTRO da porta de 0,90 m ("Start occupied" no
        # replanejamento, porque o vão inteiro ficava inflado).
        inflation_radius: 0.50
        # ⚠️ `cost_scaling_factor` baixo é o que CENTRA o robô no vão, e sem
        # ele a inflação maior não adianta nada. O padrão do Nav2 (10) faz o
        # custo despencar logo depois do inscrito: dentro da porta a paisagem
        # fica PLANA, e planner que não vê diferença entre o meio e a quina
        # escolhe o caminho mais curto — a quina. Foi o que 05-08 mediu:
        # folga de 0,331 m onde centrar daria 0,45.
        #
        # Com 3,0 o custo decai devagar e as inflações das DUAS ombreiras se
        # encontram no meio do vão, criando um mínimo exatamente no centro.
        # É o gradiente que empurra o caminho para o meio.
        cost_scaling_factor: 3.0
