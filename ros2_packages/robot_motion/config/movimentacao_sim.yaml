# Movimentação no SIMULADOR — os números verdadeiros DE LÁ.
#
# O Gazebo obedece qualquer comando; a placa real não. Por isso o simulador
# ganhou uma placa FINGIDA (`robot_base/placa_simulada`) que engole comando de
# roda pequeno demais — e estes números são a crença do controlador sobre ela.
#
# Mantenha `zona_morta` igual ao argumento `zona_morta` do `sim.launch.py`:
# assim o controlador sabe exatamente o que o atuador faz. Deixá-los
# DIFERENTES de propósito é um teste válido e interessante — é o caso "a
# medição estava errada", e mostra o quanto o robô aguenta crença errada.

heading_controller:
  ros__parameters:
    a_dec: 0.3          # planta degradada de propósito (ver DIARIO 07-27)
    wz_max: 1.0
    v_max: 0.5

    zona_morta: 0.10    # igual à da placa fingida no sim.launch.py
    margem_piso: 0.03
    bitola: 0.20        # bitola REAL do modelo simulado (robo2.urdf.xacro)

    tolerancia_rumo: 0.02
    taxa: 20.0
    timeout_alvo: 1.0
    plantao_s: 0.5
