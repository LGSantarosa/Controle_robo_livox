# Perfil do ROBÔ 3 — etapa 4, passo 4c (docs/PLANO_ETAPA4_ROBO3.md §§2–5).
#
# Só o que DIFERE da base do robô 2 (nav2.yaml, collision_monitor.yaml,
# defaults do path_follower). Montado por `robot_motion/perfil.py`.
#
#   classe (b)  geometria: SÓ referência ao artefato da 052, nenhum número.
#               Footprint, polígonos do reflexo e os seis do seguidor são
#               CALCULADOS dele + da política abaixo — nunca redigitados.
#   classe (c)  política: cada margem na sua chave, nunca somada à geometria.
#
# `herdados_provisorios` e `independentes_do_robo` fecham a PARTIÇÃO: toda
# folha numérica da base que o perfil não sobrescreve está em uma das duas.
# Herdado = medido, sintonizado ou derivado no robô 2, com a etapa que fecha
# (7 pose do Livox; 8 dinâmica, rumo e curvatura; 9 percepção e reflexo;
# 10 navegação). Parâmetro novo na base sem classificação reprova no teste.
#
# ⚠️ Perfil montável NÃO é robô liberado: a pilha recusa robo:=3 até a etapa 6.

geometria:
  classe: b
  origem: artefato canônico do robô 3 (etapa 3)
  arquivo: geometria_robo3.yaml
  decisao: '052'
footprint_padding:
  classe: c
  origem: 'D2: o valor vivo do robô 2, política herdada provisória'
  valor: 0.009999999776482582
  fecha: etapa 8
approach_margem:
  classe: c
  origem: 'D3: + faces do footprint; time_before_collision do robô 2'
  faces: 0.03
  time_before_collision: 0.75
  fecha: etapa 8
stop_margem:
  classe: c
  origem: 'D3: as margens do Stop do robô 2 por face'
  frente: 0.133
  lados: 0.05
  tras: 0.05
  fecha: etapa 8
passagem_margem:
  classe: c
  origem: herdada do robô 2 (margem geométrica por lado)
  valor: 0.03
  fecha: etapa 10
desencalhe_pivo_margem:
  classe: c
  origem: herdada do robô 2 (0,334 − 0,314)
  valor: 0.02
  fecha: etapa 8

