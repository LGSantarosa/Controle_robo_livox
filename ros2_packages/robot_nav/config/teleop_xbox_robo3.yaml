# Controle Xbox Series X|S → teleop_twist_joy, ROBÔ 3 (controle_robo3.launch.py).
#
# Botões medidos por ioctl JSIOCGBTNMAP com o controle por Bluetooth:
#   eixo 0 = analógico esq. X (giro)   eixo 1 = analógico esq. Y (frente/ré)
#   LB = botão 6 (homem-morto)         RB = botão 7 (turbo)
# Reconferir no notebook com:  python3 scripts/js_mapping.py /dev/input/js0
#
# ⚠️ NÚMEROS DE PARTIDA, NÃO CALIBRADOS (docs/PLANO_CONTROLE_ROBO3.md). Servem
# para ver o robô responder; a movimentação se calibra com o Livox montado.
#
# Giro: yaw × bitola/2 × escala = steer na placa (0,3225/2 × 400 = 64,5 por
# unidade). 14-09 (GND bom, rodas no ar, teclado_20260914_202729): steer 150 em
# pivô deu ~17 rpm, contra ~117 rpm do speed 250 reto — a placa entrega o steer
# bem mais fraco. Com 1,5/2,3 o Xbox quase não girava. 4,0 → steer ~258;
# 7,5 → steer ~484. O "rad/s" aqui NÃO é real; calibra com o Livox.
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.30          # m/s → 120 unidades na placa
    scale_linear_turbo:
      x: 0.50

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 4.0         # steer ~258
    scale_angular_turbo:
      yaw: 7.5         # steer ~484

    enable_button: 6        # LB = homem-morto (só anda enquanto segurado)
    enable_turbo_button: 7  # RB = turbo
    require_enable_button: true

    # 🔴 Casa com `use_stamped: true` do twist_mux_robo3.yaml (etapa 5: a
    # cadeia do robô 3 inteira é TwistStamped, como a do robô 2). Se só um dos
    # dois mudar, o DDS recusa a ligação por type hash e o robô não anda, sem
    # erro nenhum — `test_contrato_robo3.py` trava os dois lados.
    # `frame` é o frame_id do TwistStamped; ninguém na cadeia o usa hoje, mas
    # mensagem com header sem frame é dado pela metade.
    publish_stamped_twist: true
    frame: base_link
