# Arbitragem de comando do ROBÔ 3 no teste de controle (controle_robo3.launch.py).
#
# Uma entrada só, o controle. O mux fica mesmo assim porque é ele que dá o
# `timeout`: soltou o LB, o teleop emudece, em 0,5 s o mux para de repetir e o
# cmd_vel_to_wheels não recebe mais nada; a MEGA zera a placa pelo watchdog dela
# (0,5 s sem setpoint). E quando o Livox e a autonomia entrarem, eles ganham
# faixa aqui abaixo do humano.
#
# ⚠️ O `bin/robot-key` publica TwistStamped e, desde a etapa 5, o contrato
# BATE — mas ele continua FORA deste mux por decisão (D3): faixa humana nova
# no robô 3 é escopo próprio, não efeito colateral da unificação.
twist_mux:
  ros__parameters:
    use_sim_time: false
    # 🔴 Casa com `publish_stamped_twist: true` do teleop_xbox_robo3.yaml, com
    # o TwistStamped do dpad_reto e com o `use_stamped: true` que a launch dá
    # ao cmd_vel_to_wheels (etapa 5).
    use_stamped: true

    topics:
      # LB + direcional (dpad_reto): reta pura, manda sobre o analógico enquanto
      # apertado. Timeout curto: soltou, em 0,3 s o analógico volta.
      direcional:
        topic: dpad_vel
        timeout: 0.3
        priority: 110
      joystick:
        topic: joy_vel
        timeout: 0.5
        priority: 100
