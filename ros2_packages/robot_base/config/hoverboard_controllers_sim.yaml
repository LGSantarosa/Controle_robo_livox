# Controlador diferencial no SIMULADOR.
#
# Espelha de propósito o arquivo do robô real
# (ros2_packages/hoverboard_driver/bringup/config/hoverboard_controllers.yaml).
# Os limites de velocidade/aceleração são MANTIDOS IGUAIS aos do robô: foram
# eles que estouraram no controlador antigo (a desaceleração por desalinhamento
# saía acima do teto e era engolida), então precisam estar no laço aqui, senão
# o simulador não reproduz o problema que viemos estudar.
#
# ✅ DIVERGÊNCIA RESOLVIDA POR MEDIÇÃO — 2026-07-29
#   Era: simulador 0.20 / robô real 0.32, ambos herdados e nunca medidos.
#   Trena no robô: por fora das rodas 315 mm, por dentro 225 mm
#   → bitola real = (315+225)/2 = 0.270. Nenhum dos dois valores acertou, e
#   erravam para lados OPOSTOS: o simulador girava 26% a menos que o comandado
#   e o robô 19% a mais. Sintonizar rumo aqui e levar para o robô teria errado
#   duas vezes, em sentidos contrários.
#   Raio: 0.0825 (roda de 6,5" nominal) → 0.080 medido (diâmetro 160 mm).
# Os dois arquivos agora carregam os mesmos números medidos.

controller_manager:
  ros__parameters:
    # ⚠️ 10 Hz, IGUAL AO ROBÔ — e isto é uma CORREÇÃO de 05-08.
    #
    # Estava em 50, com esta justificativa: "mais alto que os 10 Hz do robô,
    # porque no simulador não custa nada e o contato da boba precisa de passo
    # fino". A varredura de pivô no robô mostrou que **custa**, e caro.
    #
    # A 10 Hz o atuador só é atualizado a cada 100 ms, então o tempo de comando
    # não é contínuo: ele é contado em CICLOS. Foi o que a bancada de 05-08
    # mediu sem saber que estava medindo isso — duas corridas de `liga 0,15 s`
    # (1,5 ciclos) deram 16,6° e 33,4°, razão **2,012**, porque uma pegou um
    # ciclo de comando e a outra pegou dois. Com 16,6° como o giro de um ciclo:
    #
    #     liga 0,20 s = 2 ciclos -> 33,2° previsto, robô deu 30,3 a 35,8
    #     liga 0,30 s = 3 ciclos -> 49,8° previsto, robô deu 48,0
    #
    # A 50 Hz o simulador não tem esse quantum e responde suave onde o robô
    # responde em degraus — ele parecia mais controlável do que a máquina é.
    # Igualar a taxa não modela fenômeno novo: REMOVE uma divergência conhecida.
    #
    # O preço, que a justificativa antiga anunciava: passo grosso pode degradar
    # o contato da boba (BO-4). Por isso a mudança foi validada nas DUAS
    # aceitações — a tabela do pivô e o arco de 04-08 — e não só na que motivou.
    update_rate: 10  # Hz — o mesmo do robô (bringup/config/hoverboard_controllers.yaml)
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hoverboard_base_controller:
      type: diff_drive_controller/DiffDriveController

hoverboard_base_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.270
    wheel_radius: 0.080

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # A odometria deste controlador NÃO é a fonte de pose do sistema — quem
    # localiza é /Odometry (pose verdadeira do Gazebo, papel do LIO no robô
    # real). Ela fica publicada só para comparação: a diferença entre as duas
    # É a derrapada, e é justamente o que queremos medir.
    open_loop: false
    enable_odom_tf: false

    cmd_vel_timeout: 0.5

    # --- MESMOS TETOS DO ROBÔ REAL ---
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.7
    linear.x.min_velocity: -0.7
    linear.x.max_acceleration: 0.8
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    # ⚠️ AQUI O SIMULADOR DIVERGE DO ROBÔ DE PROPÓSITO — e é para não divergir
    # no que importa. No robô a ordem da cadeia é
    #
    #     cmd_vel -> diff_drive_controller (corta em 1,0) -> DRIVER (compensa
    #     a zona morta, e o patamar sobe para ~2,20 rad/s) -> rodas
    #
    # ou seja o corte acontece ANTES da compensação, e a compensação passa por
    # cima dele: em 04-08 o robô girou 2,23 / 2,51 / 2,25 rad/s com este mesmo
    # 1,0 no arquivo. No simulador a placa fingida é um nó SEPARADO e vem
    # ANTES do controlador, então o corte cai DEPOIS da compensação e desfaz
    # justamente o que a placa existe para modelar.
    #
    # Medido com 1,0 aqui: pico de 0,45 rad/s contra 2,33 do robô — 5x menos,
    # e o pivô do simulador virava outra máquina.
    #
    # 2,204 é o patamar (100 unidades x 0,0372 rad/s/unidade, sobre a bitola);
    # 3,0 deixa folga para não raspar no teto. Mudar `deadband_speed` ou
    # `escala_real` na placa move o patamar e este número tem de acompanhar.
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 3.0
    angular.z.min_velocity: -3.0
    angular.z.max_acceleration: 1.5
    angular.z.min_acceleration: -1.5
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0
