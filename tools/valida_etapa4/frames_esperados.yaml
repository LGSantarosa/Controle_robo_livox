# Frames FT_SET_SPEED que a MEGA fingida TEM de receber — etapa 4, passo 7
# (plano §10.5). Payload `<hhhh` = steer, speed, steer_rear, speed_rear
# (rear_invert_* = false: traseira igual à frente). Frame = AA 55 01 08
# <payload> <xor de tipo+len+payload>. A comparação é EXATA, byte a byte.
#
# ⚠️ Os frames de 14-09 (DIARIO, "MEGA fingida em pty": frente −120, esquerda
# steer 97, LB solto 0) foram medidos no commit 6dfcdd0 (14-09 10:27), com
# sinal −1, bitola 0,3225, giro do teleop 1,5 rad/s e sem `frente`. Desde
# então mudaram, por decisão registrada: giro 1,5 → 4,0 (b9dcbeb, 14-09
# 20:37), sinal −1 → 1 (b4d2c39), `frente:=-1.0` padrão (3f64638, 16-09) e
# bitola 0,3225 → 0,320 (cbb0e86, 17-09). Com o padrão de hoje a esquerda NÃO
# dá 97. Por isso dois casos:
#
#   reproducao_14_09  os argumentos daquele dia + eixo de giro 0,375 (× 4,0 de
#                     hoje = 1,5, o giro de 14-09): tem de sair IGUAL à tabela
#                     de 14-09. Prova que a cadeia ATUAL reproduz os frames
#                     históricos sob condições efetivas equivalentes — NÃO que
#                     a cadeia ficou inalterada (ganho, sinal, frente e bitola
#                     mudaram).
#   padrao_hoje       sem argumento: o que o `sobe-robo3` puro entrega hoje.
#
# Os números são conferidos contra as configs por test_valida_etapa4.py —
# mudou config, o teste reprova antes de o cenário rodar.

cenarios:
  reproducao_14_09:
    argumentos: ['sinal:=-1.0', 'frente:=1.0', 'bitola:=0.3225']
    eixo_frente: 1.0
    eixo_giro: 0.375
    fases:
      lb_frente:   {steer: 0,   speed: -120}   # 0,30 × 400 × (−1)
      lb_esquerda: {steer: 97,  speed: 0}      # 1,5 × 0,16125 × 400 = 96,75
      lb_solto:    {steer: 0,   speed: 0}
  padrao_hoje:
    argumentos: []
    eixo_frente: 1.0
    eixo_giro: 1.0
    fases:
      lb_frente:   {steer: 0,    speed: -120}  # 0,30 × (frente −1) × 400
      lb_esquerda: {steer: -256, speed: 0}     # 4,0 × 0,160 × 400, sinal +1
      lb_solto:    {steer: 0,    speed: 0}

# A coreografia do /joy (20 Hz). LB = botão 6; eixo 1 = frente, eixo 0 = giro
# (+ = esquerda). Direcional (eixos 6/7) sempre 0: o dpad_reto fica calado.
# `janela_s`: o começo de cada fase é transitório (mux, timeout) e fica FORA
# da comparação; o resto da fase tem de ser 100 % o frame esperado.
fases:
  - {nome: repouso,     duracao_s: 2.0, lb: false}
  - {nome: lb_frente,   duracao_s: 3.0, lb: true,  eixo: frente}
  - {nome: lb_solto,    duracao_s: 2.0, lb: false}
  - {nome: lb_esquerda, duracao_s: 3.0, lb: true,  eixo: giro}
  - {nome: lb_solto,    duracao_s: 2.0, lb: false}
janela_s: 0.6
