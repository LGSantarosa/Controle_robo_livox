# Nós esperados de `ros2 launch robot_motion pilha.launch.py sim:=true`, com
# todos os outros argumentos no default (mapa da pista, localizacao:=fixa,
# rviz, bag e gui ligados). Etapa 4, passo 0.
#
# 🔴 É PREVISÃO pela leitura do código (commit do passo 0c), NÃO observação.
# Na sessão de Gazebo, a primeira divergência reprova e fica preservada na
# pasta da captura; cada nó a mais é IDENTIFICADO antes de entrar aqui — nunca
# copiar o grafo observado. `/launch_ros_<pid>` continua fora: só nasce sob
# demanda, e a pilha não usa as ações que o criam. A captura 1 de 21-09 achou
# cinco auxiliares internos reais do Nav2; eles entram abaixo com origem,
# expressão ancorada, cardinalidade e alias estável.
nos:
  # --- Nav2 (pilha.launch.py), servidores de ciclo de vida
  - /map_server            # com_mapa: o default do sim é o mapa da pista
  - /planner_server
  - /global_costmap/global_costmap   # criado pelo planner_server
  - /smoother_server
  - /controller_server
  - /local_costmap/local_costmap     # criado pelo controller_server
  - /bt_navigator
  - /collision_monitor
  - /lifecycle_manager_pilha         # a versão com_mapa_fixa
  # --- TF provisória (localizacao:=fixa)
  - /tf_map_odom
  # --- os nossos (pilha.launch.py); nenhum cria nó interno (conferido)
  - /heading_controller
  - /twist_mux
  - /compensador_rumo      # a versão IfCondition(sim)
  - /path_follower
  - /freeze_capture
  # --- ferramentas ligadas por padrão
  - /rviz2                 # rviz: default segue o sim
  - /rosbag2_recorder      # bag: true; nome estável no Jazzy instalado
  # --- simulador (robot_base/sim.launch.py e scan_2d.launch.py)
  - /robot_state_publisher
  - /placa_simulada
  - /ros_gz_bridge         # parameter_bridge
  - /scan_2d
  # --- dentro do processo do Gazebo (plugin gz_ros2_control)
  - /gz_ros_control        # nó do plugin (string no .so; no log de 18-09 como logger)
  - /controller_manager
  - /joint_state_broadcaster
  - /hoverboard_base_controller
  # Transitórios que NÃO entram (saem sozinhos; a estabilidade da captura os
  # espera sumir): ros_gz_sim `create` e os dois `spawner`.

# Nós reais do grafo que, por desenho das bibliotecas (Nav2, tf2_ros), não oferecem os
# serviços list_parameters/get_parameters. Eles provam composição do grafo,
# mas não têm dump a capturar. Observados e identificados na captura 1 de
# 21-09; não foram copiados silenciosamente para `nos`.
grafo_somente:
  exatos:
    # Criado por BtActionServer para a ação NavigateToPose. Nome montado em
    # nav2_behavior_tree/bt_action_server_impl.hpp.
    - /bt_navigator_navigate_to_pose_rclcpp_node
  volateis:
    # Quatro TransformListener internos (o sufixo hexadecimal é
    # endereço/identidade de runtime). Atribuição corrigida em 22-09, só no
    # comentário (a contagem 4 é a observada e não muda):
    #   - UM é do scan_2d (pointcloud_to_laserscan com target_frame), atribuído
    #     por execução isolada — só scan_2d.launch.py, domínio 45, 3/3
    #     consultas com /scan_2d + exatamente um listener
    #     (~/validacao_etapa4/20260922_131343_scan2d-isolado/);
    #   - os outros TRÊS são do Nav2, NÃO atribuídos individualmente. A lista
    #     anterior (BT Navigator, Collision Monitor e os dois Costmap2DROS)
    #     tinha quatro nomes para três listeners; qual deles não cria nó
    #     próprio não foi provado.
    - padrao: '^/transform_listener_impl_[0-9a-f]+$'
      quantidade: 4
      alias: /transform_listener_impl_<hex>

# Parâmetros que o nó LISTA mas não consegue LER (o `get_parameters` do rclcpp
# é tudo-ou-nada: um desses zera o lote inteiro). Exceção por nó + parâmetro
# EXATOS: ilegível fora daqui reprova, e exceção daqui que não aparecer (ficou
# legível ou sumiu) também reprova. Cada uma aponta para a reprodução.
# O /controller_manager entrou SÓ depois de a captura 1 da baseline v2 (21-09)
# registrar os quatro nomes que ele não lê, cada um confirmado na pilha viva.
# ⚠️ 'no' ENTRE ASPAS: sem elas o YAML 1.1 lê a chave como o booleano False.
ilegiveis_permitidos:
  - 'no': /collision_monitor
    parametro: PolygonApproach.max_points
    origem: 'reprodução isolada com collision_monitor ativo: docs/dados/2026-09-21-collision-monitor-ilegiveis/saida.txt'
  - 'no': /collision_monitor
    parametro: PolygonStop.max_points
    origem: 'reprodução isolada com collision_monitor ativo: docs/dados/2026-09-21-collision-monitor-ilegiveis/saida.txt'
  - 'no': /controller_manager
    parametro: hoverboard_base_controller.fallback_controllers
    origem: 'captura 1 da baseline v2 + releitura na pilha viva: docs/dados/2026-09-21-controller-manager-ilegiveis/saida.txt'
  - 'no': /controller_manager
    parametro: hoverboard_base_controller.node_options_args
    origem: 'captura 1 da baseline v2 + releitura na pilha viva: docs/dados/2026-09-21-controller-manager-ilegiveis/saida.txt'
  - 'no': /controller_manager
    parametro: joint_state_broadcaster.fallback_controllers
    origem: 'captura 1 da baseline v2 + releitura na pilha viva: docs/dados/2026-09-21-controller-manager-ilegiveis/saida.txt'
  - 'no': /controller_manager
    parametro: joint_state_broadcaster.node_options_args
    origem: 'captura 1 da baseline v2 + releitura na pilha viva: docs/dados/2026-09-21-controller-manager-ilegiveis/saida.txt'
