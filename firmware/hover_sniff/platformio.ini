; Contador de bytes crus entre a MEGA e a placa de hover (robô 3, 2026-09-10).
; NÃO é firmware de robô: manda SEMPRE speed=0 e não move roda nenhuma.
;
; Existe porque a sonda do Controle_robo_web_hover só diz "sem feedback da
; placa" e não separa "não chega byte nenhum" (cabo/conector/placa muda) de
; "chega byte em outro baud" (firmware da placa diferente).
;
;   pio run -t upload --upload-port /dev/ttyACM0
;   pio device monitor -b 115200 --port /dev/ttyACM0

[env:megaatmega2560]
platform      = atmelavr
board         = megaatmega2560
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
build_flags   = -std=gnu++17 -Wall -Wextra
