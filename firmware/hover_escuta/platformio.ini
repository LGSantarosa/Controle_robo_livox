; Escuta pura dos dois fios da placa de hover (robô 3, 2026-09-10).
; A MEGA NÃO TRANSMITE NADA: sem comando, sem roda, sem briga de saídas.
;
; Existe porque o contador de bytes (hover_sniff) mostrou o 19 flutuando com a
; placa conectada, e a suspeita é verde/azul cruzados em relação ao conector
; desta placa. Trocar fio às cegas põe duas saídas brigando; escutar não.
;
;   pio run -t upload --upload-port /dev/ttyACM0
;   pio device monitor -b 115200 --port /dev/ttyACM0

[env:megaatmega2560]
platform      = atmelavr
board         = megaatmega2560
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
build_flags   = -std=gnu++17 -Wall -Wextra
