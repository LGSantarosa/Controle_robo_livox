; Ponte transparente USB <-> placa de hover (robô 3, 2026-09-10).
; A MEGA não fala nada por conta própria: repete byte a byte o que o PC manda
; pelo USB para o Serial1 (TX1=18, RX1=19) e o que a placa responde de volta.
; Com isto o hoverboard_driver (protocolo 0xABCD, 115200) fala com a placa pela
; MEGA trocando só o `device` para /dev/ttyACM0 — o mesmo código do USB-TTL.
;
;   pio run -t upload --upload-port /dev/ttyACM0

[env:megaatmega2560]
platform      = atmelavr
board         = megaatmega2560
framework     = arduino
upload_speed  = 115200
build_flags   = -std=gnu++17 -Wall -Wextra
