    robot_description: "<?xml version=\"1.0\" ?><!-- =================================================================================== --><!-- |    This document was autogenerated by xacro from /home/rbe-luis/Workspace/Controle_robo_livox/install/robot_base/share/robot_base/description/robo2.urdf.xacro | --><!-- |    EDITING THIS FILE BY HAND IS NOT RECOMMENDED                                 | --><!-- =================================================================================== --><!--\n  Robô 2 — caixa de madeira, 2 rodas de hoverboard na FRENTE, roda boba ATRÁS.\n\n  Serve para o robô real e para o simulador; o argumento `sim` troca só a camada\n  de hardware do ros2_control (placa serial ↔ Gazebo), mantendo as MESMAS juntas\n  e o MESMO diff_drive_controller. Isso é de propósito: o que se ajusta no\n  simulador só transfere para o robô se a cadeia de controle for a mesma.\n\n  Dimensões da caixa e das rodas MEDIDAS COM TRENA em 2026-07-29 (ver DIARIO).\n  O que ainda é estimativa\
      \ está marcado caso a caso abaixo — sobretudo as\n  posições longitudinais (roda_x, boba_x), o trail da boba e as massas.\n  Todos os números ajustáveis estão no bloco de propriedades abaixo, de propósito:\n  a calibração vai ser comparar o comportamento daqui com o do robô real e mexer\n  nestes valores, então eles têm que estar num lugar só.\n--><robot name=\"robo2\"><!-- ==================== NÚMEROS AJUSTÁVEIS ==================== --><!-- ==================== CHASSI ==================== --><link name=\"base_link\"><visual><origin xyz=\"0 0 0.1577\"/><geometry><box size=\"0.433 0.455 0.145\"/></geometry><material name=\"madeira\"><color rgba=\"0.72 0.53 0.30 1\"/></material></visual><collision><origin xyz=\"0 0 0.1577\"/><geometry><box size=\"0.433 0.455 0.145\"/></geometry></collision><inertial><origin xyz=\"0 0 0.1577\"/><mass value=\"5.8\"/><inertia ixx=\"0.11022416666666666\" ixy=\"0\" ixz=\"0\" iyy=\"0.10078176666666666\" iyz=\"0\" izz=\"0.19068176666666667\"/></inertial></link><!--\
      \ Com as medidas reais, a caixa vai de 0,0852 a 0,2302 do chão e a bitola é\n       0,270 — o robô é mais baixo e mais largo do que o modelo estimado supunha.\n       A tendência a rolar no giro brusco é MENOR do que a que vínhamos\n       simulando; se a bancada mostrava rolagem, parte dela era do modelo. --><!-- ==================== RODAS MOTRIZES ==================== --><link name=\"left_wheel\"><visual><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.045\" radius=\"0.08\"/></geometry><material name=\"borracha\"><color rgba=\"0.15 0.15 0.15 1\"/></material></visual><collision><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.045\" radius=\"0.08\"/></geometry></collision><inertial><mass value=\"2.0\"/><inertia ixx=\"0.0035374999999999994\" ixy=\"0\" ixz=\"0\" iyy=\"0.0064\" iyz=\"0\" izz=\"0.0035374999999999994\"/></inertial></link><joint name=\"left_wheel_joint\" type=\"continuous\"><parent link=\"base_link\"/><child link=\"left_wheel\"\
      /><origin xyz=\"0.0815 0.135 0.08\"/><axis xyz=\"0 1 0\"/></joint><link name=\"right_wheel\"><visual><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.045\" radius=\"0.08\"/></geometry><material name=\"borracha\"><color rgba=\"0.15 0.15 0.15 1\"/></material></visual><collision><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.045\" radius=\"0.08\"/></geometry></collision><inertial><mass value=\"2.0\"/><inertia ixx=\"0.0035374999999999994\" ixy=\"0\" ixz=\"0\" iyy=\"0.0064\" iyz=\"0\" izz=\"0.0035374999999999994\"/></inertial></link><joint name=\"right_wheel_joint\" type=\"continuous\"><parent link=\"base_link\"/><child link=\"right_wheel\"/><origin xyz=\"0.0815 -0.135 0.08\"/><axis xyz=\"0 1 0\"/></joint><!-- ==================== RODA BOBA ==================== --><!-- Duas juntas, não uma esfera: pivô vertical + roda que gira, com a roda\n       deslocada `boba_trail` ATRÁS do pivô. Sem esse deslocamento a boba não\n       tem por que ser jogada\
      \ pra fora, e o simulador não reproduz o problema. --><link name=\"caster_fork\"><visual><origin xyz=\"-0.005 0 -0.0125\"/><geometry><box size=\"0.01 0.03 0.025\"/></geometry><material name=\"metal\"><color rgba=\"0.5 0.5 0.55 1\"/></material></visual><inertial><origin xyz=\"-0.005 0 -0.0125\"/><mass value=\"0.1\"/><inertia ixx=\"1.2708333333333335e-05\" ixy=\"0\" ixz=\"0\" iyy=\"6.0416666666666675e-06\" iyz=\"0\" izz=\"8.333333333333334e-06\"/></inertial></link><joint name=\"caster_swivel_joint\" type=\"continuous\"><parent link=\"base_link\"/><child link=\"caster_fork\"/><origin xyz=\"-0.19 0 0.0852\"/><axis xyz=\"0 0 1\"/><dynamics damping=\"0.02\" friction=\"0.05\"/></joint><link name=\"caster_wheel\"><visual><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.03\" radius=\"0.025\"/></geometry><material name=\"borracha\"><color rgba=\"0.15 0.15 0.15 1\"/></material></visual><collision><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.03\"\
      \ radius=\"0.025\"/></geometry></collision><inertial><mass value=\"0.1\"/><inertia ixx=\"2.3125000000000006e-05\" ixy=\"0\" ixz=\"0\" iyy=\"3.125000000000001e-05\" iyz=\"0\" izz=\"2.3125000000000006e-05\"/></inertial></link><joint name=\"caster_wheel_joint\" type=\"continuous\"><parent link=\"caster_fork\"/><child link=\"caster_wheel\"/><origin xyz=\"-0.01 0 -0.0602\"/><axis xyz=\"0 1 0\"/></joint><!-- ==================== Livox Mid-360 (decisão 012) ==================== --><!-- Corpo cilíndrico de ~65 mm de altura. Sem colisão de propósito: ele não\n       encosta em nada e colisão aqui só criaria contato espúrio no topo. A\n       massa entra porque ele fica ALTO e mexe no centro de massa — 265 g na\n       folha do fabricante. --><link name=\"livox_frame\"><visual><geometry><cylinder length=\"0.065\" radius=\"0.0325\"/></geometry><material name=\"livox_preto\"><color rgba=\"0.10 0.10 0.12 1\"/></material></visual><inertial><mass value=\"0.265\"/><inertia ixx=\"0.0001632786458333334\"\
      \ ixy=\"0\" ixz=\"0\" iyy=\"0.00013995312500000002\" iyz=\"0\" izz=\"0.0001632786458333334\"/></inertial></link><joint name=\"livox_joint\" type=\"fixed\"><parent link=\"base_link\"/><child link=\"livox_frame\"/><origin xyz=\"0.0 0 0.42\"/></joint><!-- ==================== ros2_control ==================== --><!-- Mesmas juntas nos dois casos; só a camada de hardware muda. --><ros2_control name=\"GazeboSimSystem\" type=\"system\"><hardware><plugin>gz_ros2_control/GazeboSimSystem</plugin></hardware><joint name=\"left_wheel_joint\"><command_interface name=\"velocity\"/><state_interface name=\"position\"/><state_interface name=\"velocity\"/></joint><joint name=\"right_wheel_joint\"><command_interface name=\"velocity\"/><state_interface name=\"position\"/><state_interface name=\"velocity\"/></joint></ros2_control><gazebo reference=\"left_wheel\"><mu1>1.0</mu1><mu2>1.0</mu2><kp>1e6</kp><kd>100.0</kd></gazebo><gazebo reference=\"right_wheel\"><mu1>1.0</mu1><mu2>1.0</mu2><kp>1e6</kp><kd>100.0</kd></gazebo><!--\
      \ Boba: rola fácil e escorrega de lado. mu2 (transversal) baixo é o que\n       permite a traseira ser arrastada lateralmente antes de o pivô alinhar. --><gazebo reference=\"caster_wheel\"><mu1>0.3</mu1><mu2>0.05</mu2><kp>1e6</kp><kd>100.0</kd></gazebo><gazebo reference=\"base_link\"><mu1>0.3</mu1><mu2>0.3</mu2></gazebo><!-- ros2_control dentro do Gazebo: sobe o MESMO controller_manager e o MESMO\n       diff_drive_controller do robô real, trocando só a interface de hardware. --><gazebo><plugin filename=\"gz_ros2_control-system\" name=\"gz_ros2_control::GazeboSimROS2ControlPlugin\"><parameters>/home/rbe-luis/Workspace/Controle_robo_livox/install/robot_base/share/robot_base/config/hoverboard_controllers_sim.yaml</parameters></plugin></gazebo><!-- Pose verdadeira publicada como /Odometry — o papel que o LIO cumpre no\n       robô real. `dimensions 3` para incluir o eixo Z e a orientação completa. --><gazebo><plugin filename=\"gz-sim-odometry-publisher-system\" name=\"gz::sim::systems::OdometryPublisher\"\
      ><odom_frame>odom</odom_frame><robot_base_frame>base_link</robot_base_frame><odom_topic>Odometry</odom_topic><tf_topic>tf_odom</tf_topic><dimensions>3</dimensions><odom_publish_frequency>50</odom_publish_frequency></plugin></gazebo><!-- ================= Livox Mid-360, fingido (decisão 012) =================\n\n       Publica em `/livox/lidar`, o MESMO tópico do driver real — mesmo\n       princípio do `/Odometry`: quem consome não deve saber a diferença.\n\n       Números da folha do Mid-360: 360° na horizontal, −7° a +52° na\n       vertical, 0,1 a 40 m, 10 Hz, ~200 000 pontos/s (aqui 400×50 = 20 000\n       por quadro a 10 Hz, que dá os mesmos 200 k/s).\n\n       ⛔ ISTO É RASTER, E O MID-360 É ROSETA NÃO REPETITIVA. Cada quadro\n       real cobre uma FRAÇÃO do campo, e a cobertura adensa com o tempo de\n       integração; aqui a grade é uniforme e igual todo quadro. O simulador\n       portanto ENXERGA MELHOR que o robô num quadro só: obstáculo fino\n       (perna de cadeira) que\
      \ a roseta pode perder aqui aparece sempre.\n\n       Serve para: campo de visão, zona cega, alcance, e amarrar a cadeia\n       nuvem→costmap→Nav2. NÃO serve para: taxa de detecção de obstáculo\n       fino, tempo de integração, ou qualquer conclusão sobre FAST-LIO (que\n       se alimenta justamente do padrão de varredura). Racional inteiro e o\n       teste de esparsidade a fazer: `docs/decisoes/012-lidar-3d-no-simulador.md`.\n\n       ⚠️ A ZONA CEGA É DE PROJETO, não defeito: com −7° de depressão o chão\n       só começa a ~8,1× a altura do sensor. Obstáculo baixo e perto é\n       invisível por geometria, e nenhuma sintonia resolve. --><!-- ⚠️ A junta fixa TEM de ser preservada. Sem isto o conversor URDF→SDF\n       colapsa `livox_frame` dentro do `base_link` e pendura o sensor lá com\n       a pose remontada — medido em 05-08: o chão aparecia a −0,307 m do\n       sensor quando o modelo diz −0,270, e a zona cega saía inconsistente\n       com o próprio ângulo do feixe (7,7° lidos\
      \ contra 7,0° configurados).\n       Com a junta preservada a pose do sensor é a que está escrita no URDF,\n       e conferível. Custo: um link a mais na árvore de TF, que é justamente\n       o que a percepção precisa para transformar a nuvem. --><gazebo reference=\"livox_joint\"><preserveFixedJoint>true</preserveFixedJoint><disableFixedJointLumping>true</disableFixedJointLumping></gazebo><gazebo reference=\"livox_frame\"><sensor name=\"livox_mid360\" type=\"gpu_lidar\"><topic>livox/lidar</topic><gz_frame_id>livox_frame</gz_frame_id><update_rate>10</update_rate><always_on>1</always_on><visualize>true</visualize><lidar><scan><horizontal><samples>400</samples><resolution>1</resolution><min_angle>-3.141593</min_angle><max_angle>3.141593</max_angle></horizontal><vertical><samples>50</samples><resolution>1</resolution><min_angle>-0.122173</min_angle><!-- −7°  --><max_angle>0.907571</max_angle><!-- +52° --></vertical></scan><range><min>0.1</min><max>40.0</max><resolution>0.01</resolution></range><!--\
      \ ~2 cm é a exatidão de folha do Mid-360. Sem ruído a nuvem sai\n             perfeita e a percepção fica ajustada contra um sensor que não\n             existe — o mesmo erro que a placa fingida existe para não repetir. --><noise><type>gaussian</type><mean>0.0</mean><stddev>0.02</stddev></noise></lidar></sensor></gazebo></robot>"
    start_type_description_service: true
    use_sim_time: true
