/robot_state_publisher: {frame_prefix: '', ignore_timestamp: false, publish_frequency: 20.0, robot_description: "<?xml version=\"1.0\" ?><!-- =================================================================================== --><!-- |    This document was autogenerated by xacro from /home/rbe-luis/Workspace/Controle_robo_livox/install/robot_base/share/robot_base/description/robo3.urdf.xacro | --><!-- |    EDITING THIS FILE BY HAND IS NOT RECOMMENDED                                 | --><!-- =================================================================================== --><!--\n  Robô 3 — caixa menor, 2 rodas de hoverboard NA FRENTE, 2 rodas bobas ATRÁS.\n\n  \U0001F504 GIRADO 180° EM 18-09 (etapa 3 do `docs/PLANO_NAV2_ROBO3.md`, §3). Até 17-09\n  este modelo tinha as motrizes atrás; o dono decidiu em 16-09 que, para\n  navegar, a frente é o lado das motrizes. O corpo girou em torno do\n  `base_link`, que continua no eixo (C8). Eletricamente a frente é a antiga ré:\n  isso é o `linear_sign:\
    \ -1.0` (`frente:=-1.0`, decisão 049), e o teste\n  `test_urdf_girado_exige_frente_negativa_no_controle` trava os dois em par.\n\n  Irmão do `robo2.urdf.xacro` e NÃO substituto: o robô 2 continua de pé porque é\n  a linha de base contra a qual todo CSV histórico foi medido. Aqui muda a\n  máquina inteira — a geometria inverteu, a bitola cresceu 57% e o apoio passou\n  de 3 para 4 pontos.\n\n  ⚠️ TODA MEDIDA VEIO DE `docs/ROBO3_REVISAO_CRUZADA.md`, seção 5.8.2, e as que\n  ainda não foram medidas estão marcadas caso a caso. Quem mediu não foi o dono:\n  as divergências entre levas estão registradas lá (D2 a D8), e o que aqui está\n  como \"medido\" é o que sobreviveu à conferência cruzada.\n\n  ⛔ O QUE ESTE MODELO AINDA NÃO SABE (não tire conclusão de dinâmica dele):\n     - massa e centro de massa: PROVISÓRIOS. O Livox e o NUC nem subiram no\n       robô, então medir agora seria medir outro robô (D7).\n     - onde o Livox monta: DECISÃO DO DONO pendente. O valor daqui é um chute\n  \
    \     documentado, e a altura do sensor manda na zona cega.\n     - a placa: pode ser outra (§5.1). O modelo de atuador herdado é o do\n       robô 2, e cai inteiro se a placa mudar.\n--><robot name=\"robo3\"><!-- ==================== ONDE FICA A ORIGEM ====================\n\n       \U0001F534 MUDANÇA DE CONVENÇÃO EM RELAÇÃO AO ROBÔ 2 (proposta C8, §5.8.1).\n\n       No robô 2 o `base_link` fica no centro da CAIXA e o eixo motor 8,15 cm à\n       frente dele. Mas quem gira é o EIXO: o robô 2 gira em torno de um ponto\n       8 cm à frente da própria origem, e todo `wz` puro sai acompanhado de\n       deslocamento lateral na origem — um acoplamento que ninguém escolheu e\n       que esteve embaixo da lei de rumo o tempo todo.\n\n       Aqui o `base_link` vai no CENTRO DO EIXO DAS MOTRIZES, no nível do chão\n       — desde 18-09 o eixo DIANTEIRO:\n\n           x = 0 no eixo das motrizes      x cresce para a FRENTE (motrizes)\n           y = 0 no plano de simetria      z = 0 no chão\n\n\
    \       Com isso o centro de rotação É a origem, e `wz` puro não desloca nada.\n       O preço: o contorno do robô deixa de ser simétrico em x (a frente tem\n       8,25 cm — o pneu, `roda_raio` — e a traseira 24,85), e comparar CSV com o\n       robô 2 exige saber disso.\n  --><!-- ==================== NÚMEROS AJUSTÁVEIS ==================== --><!-- ==================== CHASSI ====================\n       A caixa não está centrada na origem: ela fica ADIANTE do eixo, porque a\n       origem é o eixo (C8). `caixa_cx` = +0,093. --><link name=\"base_link\"><visual><origin xyz=\"-0.093 0 0.1325\"/><geometry><box size=\"0.311 0.24 0.135\"/></geometry><material name=\"madeira\"><color rgba=\"0.72 0.53 0.30 1\"/></material></visual><collision><origin xyz=\"-0.093 0 0.1325\"/><geometry><box size=\"0.311 0.24 0.135\"/></geometry></collision><inertial><origin xyz=\"-0.093 0 0.1325\"/><mass value=\"3.0\"/><inertia ixx=\"0.01895625\" ixy=\"0\" ixz=\"0\" iyy=\"0.0287365\" iyz=\"0\" izz=\"0.038580249999999996\"\
    /></inertial></link><!-- ==================== MOTRIZES (NA FRENTE desde 18-09) ====================\n       Ficam na origem em x, por definição da convenção C8. E ficam ENCOSTADAS\n       na caixa pelo cubo: lateral da caixa em 0,120, cubo até 0,135, pneu de\n       0,135 a 0,185. Zero vão — foi o vão desenhado por engano que denunciou\n       a etiqueta trocada do 37,5. --><link name=\"left_wheel\"><visual><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.06\" radius=\"0.0825\"/></geometry><material name=\"borracha\"><color rgba=\"0.15 0.15 0.15 1\"/></material></visual><collision><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.06\" radius=\"0.0825\"/></geometry></collision><!-- O cubo: liga a roda à lateral da caixa. Só visual — quem toca o chão\n           é o pneu, e dar colisão a ele criaria contato lateral que não existe. --><visual><origin rpy=\"1.5707963267948966 0 0\" xyz=\"0 -0.0375 0\"/><geometry><cylinder length=\"0.015\" radius=\"\
    0.04125\"/></geometry><material name=\"metal\"><color rgba=\"0.5 0.5 0.55 1\"/></material></visual><inertial><mass value=\"3.1\"/><inertia ixx=\"0.00620484375\" ixy=\"0\" ixz=\"0\" iyy=\"0.010549687500000002\" iyz=\"0\" izz=\"0.00620484375\"/></inertial></link><joint name=\"left_wheel_joint\" type=\"continuous\"><parent link=\"base_link\"/><child link=\"left_wheel\"/><origin xyz=\"0 0.16 0.0825\"/><axis xyz=\"0 1 0\"/></joint><link name=\"right_wheel\"><visual><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.06\" radius=\"0.0825\"/></geometry><material name=\"borracha\"><color rgba=\"0.15 0.15 0.15 1\"/></material></visual><collision><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.06\" radius=\"0.0825\"/></geometry></collision><!-- O cubo: liga a roda à lateral da caixa. Só visual — quem toca o chão\n           é o pneu, e dar colisão a ele criaria contato lateral que não existe. --><visual><origin rpy=\"1.5707963267948966 0 0\" xyz=\"0 0.0375\
    \ 0\"/><geometry><cylinder length=\"0.015\" radius=\"0.04125\"/></geometry><material name=\"metal\"><color rgba=\"0.5 0.5 0.55 1\"/></material></visual><inertial><mass value=\"3.1\"/><inertia ixx=\"0.00620484375\" ixy=\"0\" ixz=\"0\" iyy=\"0.010549687500000002\" iyz=\"0\" izz=\"0.00620484375\"/></inertial></link><joint name=\"right_wheel_joint\" type=\"continuous\"><parent link=\"base_link\"/><child link=\"right_wheel\"/><origin xyz=\"0 -0.16 0.0825\"/><axis xyz=\"0 1 0\"/></joint><!-- ==================== BOBAS (DUAS, ATRÁS) ====================\n\n       \U0001F534 QUATRO APOIOS RÍGIDOS, SEM MOLA (C3 confirmado, §5.6.2). O robô 2\n       tinha 3 pontos, que por definição não balançam; este tem 4 num chassi\n       rígido, o que é hiperestático: em piso irregular uma boba sai do chão e\n       o corpo balança entre as duas diagonais. Com o braço de 14,4 cm, 3 mm de\n       junta de piso viram 1,2° de inclinação — e o Livox vai em cima disso.\n\n       O Gazebo REPRODUZ esse balanço\
    \ (contato rígido, 4 pontos), então o\n       modelo serve para vê-lo. O que ele não decide é o conserto: complacência\n       numa boba, ou balancim que devolva o apoio a 3 pontos, é escolha\n       mecânica do dono, e é mais barata antes de o Livox subir.\n\n       Cada boba é pivô vertical + roda deslocada `boba_trail` do pivô. Em\n       repouso a rodinha fica do lado do EIXO (+x desde o giro de 18-09): é a\n       posição física girada junto com o corpo, debaixo da caixa. Andando para a\n       frente ela vira 180° e sai da caixa — isso é a envolvente varrida (§3,\n       item 5), que este modelo em repouso não mostra.\n       Trail zero = boba ideal = simulador que mente. --><link name=\"left_caster_fork\"><visual><origin xyz=\"0.01 0 -0.01\"/><geometry><box size=\"0.02 0.03 0.02\"/></geometry><material name=\"metal\"><color rgba=\"0.5 0.5 0.55 1\"/></material></visual><inertial><origin xyz=\"0.01 0 -0.01\"/><mass value=\"0.05\"/><inertia ixx=\"5.416666666666666e-06\" ixy=\"0\"\
    \ ixz=\"0\" iyy=\"3.3333333333333337e-06\" iyz=\"0\" izz=\"5.416666666666666e-06\"/></inertial></link><joint name=\"left_caster_swivel_joint\" type=\"continuous\"><parent link=\"base_link\"/><child link=\"left_caster_fork\"/><origin xyz=\"-0.2485 0.105 0.065\"/><axis xyz=\"0 0 1\"/><dynamics damping=\"0.02\" friction=\"0.05\"/></joint><link name=\"left_caster_wheel\"><visual><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.03\" radius=\"0.02\"/></geometry><material name=\"borracha\"><color rgba=\"0.15 0.15 0.15 1\"/></material></visual><collision><origin rpy=\"1.5707963267948966 0 0\"/><geometry><cylinder length=\"0.03\" radius=\"0.02\"/></geometry></collision><inertial><mass value=\"0.05\"/><inertia ixx=\"8.750000000000001e-06\" ixy=\"0\" ixz=\"0\" iyy=\"1e-05\" iyz=\"0\" izz=\"8.750000000000001e-06\"/></inertial></link><joint name=\"left_caster_wheel_joint\" type=\"continuous\"><parent link=\"left_caster_fork\"/><child link=\"left_caster_wheel\"/><origin xyz=\"\
