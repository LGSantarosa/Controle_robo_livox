bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 20
    global_frame: map
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    odom_topic: /Odometry
    robot_base_frame: base_link
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.5
      lookahead_dist: 0.55
      max_angular_accel: 1.0
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      use_collision_detection: false
    controller_frequency: 5.0
    controller_plugins:
    - FollowPath
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.15
    goal_checker_plugins:
    - goal_checker
    progress_checker:
      movement_time_allowance: 1000000000.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugins:
    - progress_checker
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[0.0825, 0.19], [0.0825, -0.19], [-0.2913, -0.19], [-0.2913, 0.19]]'
      footprint_padding: 0.009999999776482582
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.9
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: true
        livox:
          clearing: true
          data_type: PointCloud2
          expected_update_rate: 0.5
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.1
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          topic: /livox/pontos
        mark_threshold: 2
        observation_sources: livox
        origin_z: 0.0
        plugin: nav2_costmap_2d::VoxelLayer
        publish_voxel_map: false
        z_resolution: 0.05
        z_voxels: 16
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_link
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: false
      update_frequency: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[0.0825, 0.19], [0.0825, -0.19], [-0.2913, -0.19], [-0.2913, 0.19]]'
      footprint_padding: 0.009999999776482582
      global_frame: odom
      height: 4
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.9
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: true
        livox:
          clearing: true
          data_type: PointCloud2
          expected_update_rate: 0.5
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.1
          obstacle_max_range: 2.0
          raytrace_max_range: 3.0
          topic: /livox/pontos
        mark_threshold: 2
        observation_sources: livox
        origin_z: 0.0
        plugin: nav2_costmap_2d::VoxelLayer
        publish_voxel_map: true
        z_resolution: 0.05
        z_voxels: 16
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 5.0
      width: 4
map_server:
  ros__parameters:
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      angle_quantization_bins: 1
      cost_travel_multiplier: 5.0
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      plugin: nav2_smac_planner::SmacPlanner2D
      smoother:
        do_refinement: true
        max_iterations: 1000
        tolerance: 1.0e-10
        w_data: 0.2
        w_smooth: 0.3
      tolerance: 0.25
      use_final_approach_orientation: false
    expected_planner_frequency: 0.2
    planner_plugins:
    - GridBased
smoother_server:
  ros__parameters:
    savgol:
      do_refinement: true
      plugin: nav2_smoother::SavitzkyGolaySmoother
      refinement_num: 2
    simples:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - suave
    - simples
    - savgol
    suave:
      cost_check_points:
      - -0.185
      - 0.0
      - 1.0
      keep_goal_orientation: false
      keep_start_orientation: true
      minimum_turning_radius: 0.37
      path_downsampling_factor: 3
      path_upsampling_factor: 1
      plugin: nav2_constrained_smoother/ConstrainedSmoother
      reversing_enabled: false
      w_cost: 0.015
      w_curve: 30.0
      w_dist: 0.0
      w_smooth: 15000.0
